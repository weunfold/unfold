title: "[Show] "
body:
  - type: markdown
    attributes:
      value: |
        Show a plugin, a view of the loop, or a bench task you built. Every contribution gets a public record: authors, licence, origin, purpose, results and limits.
  - type: input
    id: what
    attributes:
      label: What it is
    validations:
      required: true
  - type: input
    id: licence
    attributes:
      label: Licence
      placeholder: MIT
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What it does and what it doesn't
    validations:
      required: true
