name: Unfold plugins

on:
  push:
    paths: ['plugins/unfold-*/**', 'scripts/**', '.github/workflows/plugins.yml']
  pull_request:
    paths: ['plugins/unfold-*/**', 'scripts/**', '.github/workflows/plugins.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        plugin:
          - unfold-bot-dsh
          - unfold-bridge-dsh
          - unfold-capabilities-dsh
          - unfold-events-dsh
          - unfold-mind-dsh
          - unfold-session-dsh
          - unfold-settings-dsh
          - unfold-sse-dsh
          - unfold-trajectory-dsh
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.13.1
      - run: bun install --frozen-lockfile
      - run: bun run harness
      - name: Build client
        run: |
          if [ -f scripts/build-client.mjs ]; then
            node scripts/build-client.mjs
          fi
      - name: Test plugin
        run: |
          if [ -f test/harness-resolve.mjs ]; then
            node --import ./test/harness-resolve.mjs --test --test-concurrency=4 --test-force-exit "test/*.test.js"
          else
            node --test --test-concurrency=4 "test/*.test.js"
          fi
      - name: Check committed bundle
        run: git diff --exit-code -- client.js

  copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun test scripts/unfold-copies.test.ts scripts/sse-copies.test.ts scripts/plugin-delivery.test.ts
