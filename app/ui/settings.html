<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<!-- Unfold's Settings window. macOS System Settings styling on purpose (not the we unfold design
     system): SF Pro, system colours, light and dark following the Mac. The sidebar is transparent
     over the window's Sidebar vibrancy; outside the app (a preview) it gets a solid colour. -->
<style>
  :root {
    color-scheme: light dark;
    --accent: #007aff;
    --label: #1d1d1f;
    --secondary: rgba(60, 60, 67, .62);
    --tertiary: rgba(60, 60, 67, .36);
    --pane: #ececec;
    --group: #f6f6f6;
    --group-line: rgba(0, 0, 0, .055);
    --sep: rgba(0, 0, 0, .085);
    --sidebar: #e4e2e6;
    --sidebar-line: rgba(0, 0, 0, .09);
    --field: rgba(0, 0, 0, .055);
    --control: #ffffff;
    --control-line: rgba(0, 0, 0, .14);
    --switch-off: rgba(0, 0, 0, .1);
    --press: rgba(0, 0, 0, .05);
    --warn: #c93400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #0a84ff;
      --label: #f5f5f7;
      --secondary: rgba(235, 235, 245, .6);
      --tertiary: rgba(235, 235, 245, .3);
      --pane: #1e1e1e;
      --group: #282828;
      --group-line: rgba(255, 255, 255, .055);
      --sep: rgba(255, 255, 255, .075);
      --sidebar: #2b292d;
      --sidebar-line: rgba(0, 0, 0, .5);
      --field: rgba(255, 255, 255, .07);
      --control: #4a4a4c;
      --control-line: rgba(255, 255, 255, .06);
      --switch-off: rgba(255, 255, 255, .14);
      --press: rgba(255, 255, 255, .06);
      --warn: #ff9f0a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--label); background: transparent; overflow: hidden;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default;
  }
  .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  /* sidebar: transparent over the vibrancy; a preview paints it */
  .sidebar { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--sidebar-line); }
  .preview .sidebar { background: var(--sidebar); }
  .sidebar-top { height: 52px; flex: none; }
  .search { margin: 0 10px 8px; position: relative; }
  .search input {
    width: 100%; height: 28px; border: 0; border-radius: 8px; padding: 0 8px 0 27px;
    font: inherit; color: var(--label); background: var(--field); outline: none;
  }
  .search input::placeholder { color: var(--secondary); }
  .search input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
  .search svg { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; fill: var(--secondary); }
  nav { overflow: auto; padding: 2px 10px 12px; flex: 1; }
  .nav-gap { height: 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 7px;
    color: var(--label); border: 0; background: none; width: 100%; font: inherit; text-align: left;
  }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-item.on { background: var(--accent); color: #fff; }
  .nav-item .ico { width: 20px; height: 20px; border-radius: 5px; }
  .nav-item .ico svg { width: 13px; height: 13px; }
  .no-results { color: var(--secondary); text-align: center; padding: 18px 0; }
  .traffic { position: absolute; top: 18px; left: 18px; display: flex; gap: 8px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
  .traffic i:nth-child(1) { background: #ff5f57; } .traffic i:nth-child(2) { background: #febc2e; } .traffic i:nth-child(3) { background: #28c840; }

  /* icons: small rounded squares, white glyphs */
  .ico { flex: none; display: grid; place-items: center; color: #fff; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.1); }
  .ico svg { fill: currentColor; }
  .i-general { background: linear-gradient(#a2a2a7, #6e6e73); }
  .i-appearance { background: linear-gradient(#3a3a3c, #121214); }
  @media (prefers-color-scheme: dark) { .i-appearance { box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); } }
  .i-models { background: linear-gradient(#c86bf7, #8a3fc4); }
  .i-dictation { background: linear-gradient(#ff7a6b, #e5383b); }
  .i-memory { background: linear-gradient(#ff7a95, #e23b67); }
  .i-delegation { background: linear-gradient(#ffb340, #f57c00); }
  .i-privacy { background: linear-gradient(#4aa3ff, #0a64e0); }
  .i-update { background: linear-gradient(#a2a2a7, #6e6e73); }
  .i-about { background: linear-gradient(#a2a2a7, #6e6e73); }
  .i-language { background: linear-gradient(#4aa3ff, #0a64e0); }

  /* the pane */
  .pane { background: var(--pane); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 16px 0 10px; }
  .toolbar button {
    width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--label);
    display: grid; place-items: center; padding: 0;
  }
  .toolbar button:disabled { color: var(--tertiary); }
  .toolbar button:not(:disabled):hover { background: var(--press); }
  .toolbar button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .toolbar h1 { font-size: 15px; font-weight: 700; margin: 0 0 0 4px; letter-spacing: -.01em; }
  .scroll { overflow: auto; flex: 1; padding: 0 20px 28px; }
  .col { max-width: 640px; margin: 0 auto; }
  .group { background: var(--group); border: 1px solid var(--group-line); border-radius: 10px; margin: 0 0 18px; overflow: hidden; }
  .hero { text-align: center; padding: 22px 28px 20px; }
  .hero .ico { width: 64px; height: 64px; border-radius: 15px; margin: 0 auto 12px; box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 0 0 .5px rgba(0,0,0,.1); }
  .hero .ico svg { width: 38px; height: 38px; }
  .hero h2 { font-size: 17px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.015em; }
  .hero p { margin: 0 auto; max-width: 440px; color: var(--secondary); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 7px 12px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; height: 1px; background: var(--sep); }
  .row.link { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; }
  .row.link:active { background: var(--press); }
  .row.link:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .ico { width: 24px; height: 24px; border-radius: 6px; }
  .row .ico svg { width: 15px; height: 15px; }
  .row .text { flex: 1; min-width: 0; }
  .row .sub { color: var(--secondary); font-size: 11.5px; margin-top: 1px; }
  .row .value { color: var(--secondary); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
  .row .value.mono, .path { font: 12px ui-monospace, "SF Mono", Menlo, monospace; -webkit-user-select: text; user-select: text; cursor: text; }
  .chev { width: 8px; height: 13px; flex: none; fill: none; stroke: var(--tertiary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .group-title { font-size: 13px; font-weight: 600; margin: 0 0 7px 2px; }
  .foot { color: var(--secondary); font-size: 11.5px; margin: -11px 2px 18px; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); margin-left: 6px; vertical-align: 1px; }

  /* controls */
  .switch { flex: none; width: 32px; height: 19px; border-radius: 10px; border: 0; padding: 0; position: relative; background: var(--switch-off); transition: background .18s; }
  .switch::after { content: ""; position: absolute; top: 1px; left: 1px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.06); transition: transform .18s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(13px); }
  .switch:disabled { opacity: .45; }
  .switch:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px; }
  .popup { position: relative; flex: none; }
  .popup select {
    -webkit-appearance: none; appearance: none; font: inherit; color: var(--label); background: var(--control);
    border: .5px solid var(--control-line); border-radius: 6px; padding: 2px 26px 2px 9px; height: 22px; max-width: 280px;
    box-shadow: 0 .5px 1px rgba(0,0,0,.12); outline: none;
  }
  .popup select:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 50%, transparent); }
  .popup::after {
    content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 4px; pointer-events: none;
    background: var(--accent) url("ds/popup-chevron.svg") center/12px no-repeat;
  }
  .btn {
    flex: none; font: inherit; color: var(--label); background: var(--control); border: .5px solid var(--control-line);
    border-radius: 6px; padding: 2px 12px; height: 22px; box-shadow: 0 .5px 1px rgba(0,0,0,.12);
  }
  .btn:active { filter: brightness(.94); }
  .btn:disabled { color: var(--tertiary); }
  .btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px; }

  /* Software Update */
  .status { display: flex; gap: 14px; align-items: center; padding: 16px 14px; }
  .status .ico { width: 44px; height: 44px; border-radius: 11px; }
  .status .ico svg { width: 26px; height: 26px; }
  .status h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .status .sub { color: var(--secondary); margin-top: 2px; }
  .status .err { color: var(--secondary); font-size: 11.5px; margin-top: 4px; -webkit-user-select: text; user-select: text; word-break: break-word; }
  .bar { height: 5px; border-radius: 3px; background: var(--switch-off); margin-top: 7px; overflow: hidden; max-width: 320px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  /* Dictation: a model per row, its facts under its name, its actions at the right */
  .row.dict { align-items: flex-start; }
  .row.dict .acts { display: flex; gap: 6px; flex: none; align-items: center; }
  .row.dict .facts { color: var(--secondary); font-size: 11.5px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px 10px; }
  .row.dict .facts a { color: inherit; }
  .row.dict .err { color: var(--warn); font-size: 11.5px; margin-top: 4px; }
  .row.dict .stat { color: var(--secondary); font-size: 11.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .row.dict .stat.warn { color: var(--warn); }
  .bar.wait i { width: 30% !important; animation: dict-slide 1.2s ease-in-out infinite alternate; }
  .bar.held i { opacity: .45; }
  @keyframes dict-slide { from { margin-left: 0 } to { margin-left: 70% } }
  @media (prefers-reduced-motion: reduce) { .bar.wait i { animation: none; width: 100% !important; opacity: .5; } }
  .row .sub.prog { font-variant-numeric: tabular-nums; }
  .row.dict .heard { margin-top: 7px; padding: 7px 9px; border-radius: 6px; background: var(--fill, rgba(127,127,127,.1)); font-size: 12.5px; }
  .row.dict .heard .sub { margin-top: 3px; font-size: 11px; }
  .badge.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--switch-off); border-top-color: var(--secondary); display: inline-block; vertical-align: -2px; margin-right: 6px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notes { padding: 10px 12px 12px; white-space: pre-line; color: var(--label); -webkit-user-select: text; user-select: text; }

  /* Appearance */
  .looks { display: flex; justify-content: center; gap: 22px; padding: 18px 12px 14px; }
  .look { border: 0; background: none; padding: 0; font: inherit; color: var(--label); display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .look .thumb { width: 92px; height: 60px; border-radius: 8px; position: relative; overflow: hidden; box-shadow: 0 0 0 1px var(--group-line), 0 1px 2px rgba(0,0,0,.15); }
  .look.on .thumb { box-shadow: 0 0 0 3px var(--accent), 0 1px 2px rgba(0,0,0,.15); }
  .look.on span { font-weight: 600; }
  .look:focus-visible .thumb { outline: 2px solid var(--accent); outline-offset: 4px; }
  .thumb .t-day, .thumb .t-night { position: absolute; inset: 0; }
  .t-day { background: #f4efe6; }
  .t-night { background: #17140f; }
  .thumb .dot { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; }
  .t-day .dot { background: radial-gradient(circle, rgba(124,82,16,.85), rgba(124,82,16,0) 70%); }
  .t-night .dot { background: radial-gradient(circle, rgba(230,180,90,.9), rgba(230,180,90,0) 70%); }
  .thumb .line { position: absolute; left: 14px; right: 14px; bottom: 9px; height: 5px; border-radius: 3px; }
  .t-day .line { background: rgba(42,36,28,.18); } .t-night .line { background: rgba(239,232,220,.2); }
  .t-split { clip-path: polygon(52% 0, 100% 0, 100% 100%, 48% 100%); }

  .note { margin: -8px 2px 16px; color: var(--warn); font-size: 11.5px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 500; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border: 0; border-radius: 999px; padding: 3px 11px 3px 9px; margin: 8px 0 0; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sheet-wrap { position: fixed; inset: 0; background: rgba(0, 0, 0, .18); display: flex; justify-content: center; align-items: flex-start; padding-top: 52px; z-index: 10; }
  .sheet { width: min(440px, calc(100vw - 40px)); background: var(--group); border: 1px solid var(--group-line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .3); padding: 20px 20px 16px; }
  .sheet h3 { margin: 0 0 2px; font-size: 13px; font-weight: 700; }
  .sheet .sub { color: var(--secondary); font-size: 11.5px; margin-bottom: 10px; }
  .sheet ul { margin: 0 0 16px; padding-left: 18px; -webkit-user-select: text; user-select: text; }
  .sheet li { margin: 0 0 5px; }
  .sheet .actions { display: flex; justify-content: flex-end; }
  .btn.default { background: var(--accent); color: #fff; border-color: transparent; }
  /* Self: System Settings drill-down. A header with a blank agent ("Soon": visual expression
     comes later), a kind "getting to know you" summary from real counts, proposals as the one primary
     action, then rows into sub-panes; tuning lives behind disclosure rows and Advanced. */
  .i-self { background: linear-gradient(#a2a2a7, #6e6e73); }
  .badge.sample { background: color-mix(in srgb, var(--secondary) 16%, transparent); color: var(--secondary); }
  .sample-line { margin: 0 2px 10px; }
  .sample-line .badge { margin: 0; }
  .me { display: flex; align-items: center; gap: 14px; padding: 16px 14px; }
  .me .text { flex: 1; min-width: 0; }
  .me .nm { font-size: 17px; font-weight: 700; letter-spacing: -.015em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .me .sub { color: var(--secondary); margin-top: 2px; }
  /* the blank agent: an outline in system grey, no fill, no colour, no motion */
  /* pure greys (the system label greys carry a blue tint): --agent-ink, #707070 on light, #9b9b9b on dark */
  .agent { --agent-ink: #707070; position: relative; flex: none; width: 60px; height: 60px; color: var(--agent-ink); }
  @media (prefers-color-scheme: dark) { .agent { --agent-ink: #9b9b9b; } }
  .agent svg { width: 60px; height: 60px; display: block; fill: none; stroke: var(--agent-ink); stroke-opacity: .75; stroke-width: 1.5; }
  .agent .soon { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); font-size: 9.5px; font-weight: 600; letter-spacing: .02em; color: var(--agent-ink); background: var(--group); border: 1px solid rgba(128, 128, 128, .35); border-radius: 999px; padding: 0 6px; line-height: 15px; white-space: nowrap; }
  .know { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 12px 12px; }
  .ring { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .ring svg { width: 44px; height: 44px; flex: none; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--switch-off); stroke-width: 6; }
  .ring .fill { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring.r1 .fill { stroke: var(--accent); } .ring.r2 .fill { stroke: #34c759; } .ring.r3 .fill { stroke: #ff9f0a; }
  .ring.grow .fill { animation: ringgrow .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes ringgrow { from { stroke-dashoffset: var(--o0); } to { stroke-dashoffset: var(--o1); } }
  .ring b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ring .lbl { color: var(--label); font-size: 11.5px; }
  .ring .nx { color: var(--secondary); font-size: 10.5px; }
  .miles { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
  .mile { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--secondary); background: var(--field); border-radius: 999px; padding: 3px 9px 3px 6px; }
  .mile svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mile.got { color: var(--label); }
  .mile.got svg { stroke: var(--accent); }
  .mile.new { box-shadow: 0 0 0 1.5px var(--accent); animation: milein .5s ease-out both; }
  @keyframes milein { from { transform: scale(.85); opacity: 0; } }
  .field { font: inherit; color: var(--label); background: var(--control); border: .5px solid var(--control-line); border-radius: 6px; padding: 3px 8px; height: 24px; width: 180px; box-shadow: inset 0 .5px 1px rgba(0,0,0,.08); }
  .field.wide { flex: 1; width: auto; min-width: 0; }
  .field:focus-visible, .prompt:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 50%, transparent); }
  .prop[tabindex="-1"]:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: -2px; }
  .field.bad { box-shadow: 0 0 0 2px color-mix(in srgb, var(--warn) 60%, transparent); }
  .count { color: var(--tertiary); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 10px; }
  .card { text-align: left; font: inherit; color: var(--label); background: var(--control); border: .5px solid var(--control-line); border-radius: 8px; padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-height: 80px; box-shadow: 0 .5px 1px rgba(0,0,0,.08); }
  .card .sw { width: 22px; height: 5px; border-radius: 3px; }
  .card b { font-weight: 600; font-size: 12.5px; }
  .card span { color: var(--secondary); font-size: 11px; line-height: 1.32; }
  .card.on { box-shadow: 0 0 0 2px var(--accent); border-color: transparent; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .disc { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; }
  .disc .chev { transition: transform .2s; }
  .disc[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .disc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .axis { display: grid; grid-template-columns: 1fr 1.6fr 1fr; align-items: center; gap: 10px; padding: 9px 12px; position: relative; }
  .axis::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; height: 1px; background: var(--sep); }
  .axis .pole { color: var(--secondary); font-size: 11.5px; }
  .axis .pole.r { text-align: right; }
  .axis .nm { grid-column: 1 / -1; margin-bottom: -4px; }
  .range { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--switch-off); margin: 0; }
  .range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 .5px 2px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.08); }
  .range:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 4px; }
  .sample-q { color: var(--secondary); font-size: 11.5px; }
  .bubble { margin-top: 6px; padding: 9px 11px; border-radius: 12px 12px 12px 4px; background: var(--field); font-size: 13px; -webkit-user-select: text; user-select: text; }
  .bubble.off { background: none; border: 1px dashed var(--control-line); color: var(--secondary); border-radius: 8px; }
  .shimmer { height: 9px; border-radius: 5px; margin: 6px 0; background: linear-gradient(90deg, var(--switch-off) 30%, var(--field) 50%, var(--switch-off) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
  .shimmer.s2 { width: 72%; }
  @keyframes shimmer { from { background-position: 100% 0 } to { background-position: 0 0 } }
  .prop { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; position: relative; }
  .prop + .prop::before, .row + .prop::before, .prop + .row::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; height: 1px; background: var(--sep); }

  const automagik = (v) => {

  const ownPrivacy = (v) => {

  if (here.sub) past = [{ pane: here.pane, sub: null }]
  if (APP) call({ action: 'get' }).then((v) => { view = v; render() }).catch((e) => { view = { error: String(e) }; render() })
  else { view = DEMO; render(); if (h.get('sheet')) openSheet() }
})()
</script>
