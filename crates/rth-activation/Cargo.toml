[package]
name = "rth-activation"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "RTH desktop first run and recoverable activation (DMG plan step 3): leases, effect barrier, activation records, Keychain"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
security-framework = "3"

[[bin]]
name = "rth-activate"
path = "src/main.rs"

[workspace]
