# Mounts the Unfold Bot beside the Bot team (@automagik/bots-dsh, row omni-ui), whose runtime it
# injects as the omniTeam service. The plugin has no browser half: the team draws the Unfold Bot
# by its kind.
#
# Installed into someone's own DSH, this patch adds that row and changes nothing of theirs.
- insert:
    - id: unfold-bot
      name: '@automagik/unfold-bot-dsh'
